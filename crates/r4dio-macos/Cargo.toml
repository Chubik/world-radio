[package]
name = "r4dio-macos"
version.workspace = true
edition = "2021"
license = "MIT"
description = "r4dio for macOS: a menubar companion that shuffles and plays stations."
repository = "https://github.com/Chubik/world-radio"

[[bin]]
name = "r4dio-macos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
radio-core = { path = "../radio-core" }
radio-audio = { path = "../radio-audio" }
anyhow = "1"
fastrand = "2"
qrcode = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"

[dev-dependencies]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
