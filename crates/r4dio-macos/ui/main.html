<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>r4dio</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="views/account.css" />
  </head>
  <body class="win_body">
    <div class="tabbar">
      <div class="tab" data-tab="library">LIBRARY<span class="kk">⌘1</span></div>
      <div class="tab" data-tab="settings">SETTINGS<span class="kk">⌘2</span></div>
      <div class="clock" id="clock"></div>
    </div>

    <section class="pane" data-pane="library">
      <div class="libgrid">
        <aside class="nowpanel">
          <div class="art" id="art"></div>

          <div class="stationnm" id="np_name">nothing playing</div>
          <div class="stmeta" id="np_meta"></div>
          <div class="status" id="np_status"></div>

          <div class="transport">
            <div class="sm shuffle" id="np_shuffle" title="Shuffle (r)">⇄</div>
            <div class="big" id="np_play" title="Play / stop (space)">▶</div>
            <div class="sm" id="np_star" title="Favourite (f)">☆</div>
          </div>

          <div class="volrow">
            <span class="lbl">VOL</span>
            <div class="bar" id="np_volbar"><i></i></div>
            <span class="val" id="np_vol">—</span>
          </div>

          <div class="upnext" id="np_scope"></div>
        </aside>

        <div class="listpanel">
          <div class="listtop">
            <div class="search">
              <span class="cursor">▌</span>
              <input id="search" type="search" placeholder="search every station by name…" />
              <span class="resultcount" id="count"></span>
            </div>
            <div class="segrow" id="segrow">
              <span data-seg="all">All</span>
              <span data-seg="favourites">Favourites</span>
              <span data-seg="history">History</span>
            </div>
            <div class="statebar" id="statebar"></div>
          </div>
          <div class="listhead" id="listhead"></div>
          <div class="listbody" id="listbody"></div>
        </div>
      </div>
    </section>

    <section class="pane" data-pane="settings">
      <div class="setbody">
        <div class="subtabs" id="set_tabs">
          <span data-sub="countries">COUNTRIES</span>
          <span data-sub="shortcuts">SHORTCUTS</span>
          <span data-sub="account">ACCOUNT</span>
        </div>
        <div class="sub" data-sub="countries" id="pane_countries"></div>
        <div class="sub" data-sub="shortcuts" id="pane_shortcuts"></div>
        <div class="sub" data-sub="account" id="account_host"></div>
      </div>
    </section>

    <div class="footerbar" id="footerbar"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
