<!DOCTYPE html>
<html><head><meta charset="UTF-8" /><link rel="stylesheet" href="../main.css" /></head>
<body><pre id="out"></pre><div id="browse_host"></div>
<script type="module">
// browse drives real DOM against a stubbed tauri bridge rather than by launching
// the app. the stub counts calls, because the two things that matter here —
// debouncing and lazy expansion — are about calls that must NOT happen.
const calls = [];
const LIMIT = 200;

// a country big enough to be capped, so the "first 200" path is exercised.
const bigCountry = Array.from({ length: LIMIT }, (_, i) => ({
  uuid: `us${i}`, name: `US Station ${i}`, country: "US", codec: "MP3", bitrate: 128, is_playing: false,
}));
const ukraine = [
  { uuid: "ua1", name: "Radio ROKS", country: "UA", codec: "MP3", bitrate: 192, is_playing: false },
  { uuid: "ua2", name: "Hromadske Radio", country: "UA", codec: "AAC", bitrate: 64, is_playing: false },
];
const jazz = [
  { uuid: "j1", name: "Smooth Jazz Cafe", country: "MX", codec: "AAC", bitrate: 48, is_playing: false },
  { uuid: "j2", name: "KJZZ Straight Ahead Jazz", country: "US", codec: "MP3", bitrate: 128, is_playing: false },
];
let favourites = ["j1"];

window.__TAURI__ = {
  core: {
    invoke: async (cmd, args) => {
      calls.push([cmd, args]);
      if (cmd === "countries") {
        return [
          { code: "US", count: 7666, excluded: false },
          { code: "UA", count: 312, excluded: false },
          { code: "PL", count: 941, excluded: false },
        ];
      }
      if (cmd === "favourite_ids") return favourites;
      if (cmd === "search") {
        if (args.name.includes("jazz")) return { stations: jazz, capped: false };
        if (args.name.includes("radio")) return { stations: bigCountry, capped: true };
        return { stations: [], capped: false };
      }
      if (cmd === "stations_in") {
        if (args.country === "UA") return { stations: ukraine, capped: false };
        return { stations: bigCountry, capped: true };
      }
      if (cmd === "add_favourite") {
        if (!favourites.includes(args.uuid)) favourites.push(args.uuid);
        return favourites;
      }
      if (cmd === "play_uuid") return null;
      throw new Error(`unexpected command ${cmd}`);
    },
  },
  event: { listen: async () => {} },
};

const { mountBrowse, DEBOUNCE_MS } = await import("./browse.js");

const out = [];
let failed = 0;
function eq(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) failed++;
  out.push(`${ok ? "ok  " : "FAIL"} ${name}${ok ? "" : ` — got ${JSON.stringify(got)} want ${JSON.stringify(want)}`}`);
}
const settle = () => new Promise((r) => setTimeout(r, 0));
const after = (ms) => new Promise((r) => setTimeout(r, ms));
const countOf = (cmd) => calls.filter((c) => c[0] === cmd).length;

const host = document.getElementById("browse_host");
const view = mountBrowse(host);
await settle();

// ── the country tree ────────────────────────────────────────────────────────
eq("every country with stations gets a node", host.querySelectorAll(".treenode").length, 3);
eq("a code becomes a readable name",
   host.querySelector(".treehead").textContent.includes("United States"), true);
eq("each node carries its count",
   host.querySelectorAll(".treehead .cnt")[0].textContent, "7,666");
eq("nothing is expanded to begin with", host.querySelectorAll(".treebody").length, 0);

// the load-only-on-open rule: mounting must not have asked for any station.
eq("mounting loads no stations at all", countOf("stations_in"), 0);

// ── lazy expansion ──────────────────────────────────────────────────────────
const headOf = (name) =>
  [...host.querySelectorAll(".treehead")].find((h) => h.textContent.includes(name));
headOf("Ukraine").click();
await settle();
eq("opening a country loads it", countOf("stations_in"), 1);
eq("only the opened country was asked for", calls.at(-1)[1], { country: "UA" });
eq("its stations appear", host.querySelectorAll(".treebody .srow").length, 2);
eq("the open node is marked", host.querySelectorAll(".treenode.open").length, 1);

// re-opening must reuse what it already loaded rather than re-querying.
headOf("Ukraine").click();
await settle();
eq("closing hides the rows", host.querySelectorAll(".treebody .srow").length, 0);
headOf("Ukraine").click();
await settle();
eq("re-opening does not re-query", countOf("stations_in"), 1);
eq("re-opening still shows the rows", host.querySelectorAll(".treebody .srow").length, 2);

// a country far larger than the cap must still open bounded, and say so.
headOf("United States").click();
await settle();
eq("a huge country is capped", host.querySelectorAll(".treenode.open")[0].querySelectorAll(".srow").length, LIMIT);
const usNode = [...host.querySelectorAll(".treenode")].find((n) => n.textContent.includes("United States"));
eq("a capped node admits it", /first 200 results/.test(usNode.textContent), true);

// ── search debouncing ───────────────────────────────────────────────────────
const input = host.querySelector(".searchfield input");
const before = countOf("search");
"jazz".split("").forEach((_, i) => {
  input.value = "jazz".slice(0, i + 1);
  input.dispatchEvent(new Event("input"));
});
await settle();
eq("typing does not search on every keystroke", countOf("search") - before, 0);
await after(DEBOUNCE_MS + 60);
eq("one search runs once typing stops", countOf("search") - before, 1);
eq("the search used the final term", calls.at(-1)[1], { name: "jazz" });

// the results repaint under the box the user is typing into; if that ever
// rebuilt the field, the next keystroke would go nowhere.
input.focus();
eq("typing keeps focus in the search box", document.activeElement === input, true);
input.value = "jazz ";
input.dispatchEvent(new Event("input"));
await after(DEBOUNCE_MS + 60);
eq("a repaint does not steal focus from the box", document.activeElement === input, true);

// ── result rows ─────────────────────────────────────────────────────────────
const searchesSoFar = countOf("search");
const results = host.querySelector(".results");
eq("every match gets a row", results.querySelectorAll(".srow").length, 2);
eq("a match shows its name", results.querySelectorAll(".nm")[0].textContent, "Smooth Jazz Cafe");
eq("an already-starred match says so",
   results.querySelectorAll(".sub")[0].textContent, "AAC 48k · already in ★");
eq("an unstarred match shows only its format",
   results.querySelectorAll(".sub")[1].textContent, "MP3 128k");
eq("the result count is shown", /2 results/.test(results.textContent), true);

// ☆ adds; the row it was pressed on must then read as starred.
results.querySelectorAll(".act")[1].click();
await settle();
eq("☆ added the station", favourites.includes("j2"), true);
eq("the row now says it is starred",
   /already in ★/.test(host.querySelector(".results").querySelectorAll(".sub")[1].textContent), true);
eq("adding did not re-run the search", countOf("search"), searchesSoFar);

// pressing ☆ again must not unstar it — browse's ☆ only ever adds.
const addsBefore = countOf("add_favourite");
host.querySelector(".results").querySelectorAll(".act")[1].click();
await settle();
eq("☆ on a starred row keeps it starred", favourites.includes("j2"), true);
eq("☆ is an add, not a toggle", countOf("add_favourite") - addsBefore, 1);

// clicking the row body plays it, rather than starring it.
const playsBefore = countOf("play_uuid");
host.querySelector(".results .srow").click();
await settle();
eq("a row click plays the station", countOf("play_uuid") - playsBefore, 1);
eq("it played the row that was clicked", calls.at(-1)[1], { uuid: "j1" });

// ── a capped search ─────────────────────────────────────────────────────────
input.value = "radio";
input.dispatchEvent(new Event("input"));
await after(DEBOUNCE_MS + 60);
eq("a capped search is bounded", host.querySelectorAll(".results .srow").length, LIMIT);
eq("a capped search admits it", /first 200 results/.test(host.querySelector(".results").textContent), true);

// ── a term too short to search ──────────────────────────────────────────────
const shortBefore = countOf("search");
input.value = "j";
input.dispatchEvent(new Event("input"));
await after(DEBOUNCE_MS + 60);
eq("one letter is not searched", countOf("search") - shortBefore, 0);
eq("a short term clears the results, it does not error",
   host.querySelectorAll(".results .srow").length, 0);
eq("the country tree survives a cleared search", host.querySelectorAll(".treenode").length, 3);

// clearing entirely goes back to browsing, without a stray search.
input.value = "";
input.dispatchEvent(new Event("input"));
await after(DEBOUNCE_MS + 60);
eq("clearing the box runs no search", countOf("search") - shortBefore, 0);
eq("clearing the box shows the tree again", host.querySelectorAll(".treenode").length, 3);

// ── a term that matches nothing ─────────────────────────────────────────────
input.value = "zzzznothing";
input.dispatchEvent(new Event("input"));
await after(DEBOUNCE_MS + 60);
eq("no match shows an empty state", host.querySelectorAll(".results .empty").length, 1);
eq("no match is not an error", host.querySelectorAll(".results .empty_mark.err").length, 0);

// ── re-entering the section ─────────────────────────────────────────────────
// leaving browse and coming back must not throw away a typed search or an open
// country, but a star removed elsewhere has to stop showing "already in ★".
input.value = "jazz";
input.dispatchEvent(new Event("input"));
await after(DEBOUNCE_MS + 60);
headOf("Ukraine").click();
await settle();
const openBefore = host.querySelectorAll(".treenode.open").length;
const treeCallsBefore = countOf("stations_in");
favourites = favourites.filter((u) => u !== "j1");
await view.syncStars();
await settle();
eq("re-entering keeps the open country open", host.querySelectorAll(".treenode.open").length, openBefore);
eq("re-entering does not re-query a country", countOf("stations_in") - treeCallsBefore, 0);
eq("re-entering keeps the search results",
   host.querySelectorAll(".results .srow").length, 2);
eq("a star removed elsewhere stops showing here",
   /already in ★/.test(host.querySelectorAll(".results .sub")[0].textContent), false);

// ── RU/BY ───────────────────────────────────────────────────────────────────
// the tree is built from countries(), which already drops them; nothing the
// view draws may mention them either.
const drawn = host.textContent;
eq("no russia anywhere in browse", /russia/i.test(drawn), false);
eq("no belarus anywhere in browse", /belarus/i.test(drawn), false);

document.getElementById("out").textContent =
  out.join("\n") + `\n\n${failed === 0 ? "ALL PASS" : failed + " FAILED"}`;
</script></body></html>
