<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>r4dio</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="scan"></div>
      <div class="glow"></div>
      <div class="body">
        <div class="row head">
          <span class="mark"><i>▌</i>r<i>4</i>dio<em class="ver" id="ver"></em></span>
          <span class="state" id="state"><b class="dot" id="dot"></b><span id="state_text">IDLE</span></span>
          <span class="meta" id="meta"></span>
        </div>

        <div class="row now">
          <div class="now_text">
            <div class="station" id="station"><span id="station_text">Nothing playing</span></div>
          </div>
          <span class="star" id="star" title="Add to favourites">☆</span>
        </div>

        <div class="row controls">
          <button class="btn primary" id="primary">⇄ SHUFFLE</button>
          <button class="btn" id="play">▶</button>
        </div>

        <div class="row foot">
          <div class="scope" id="scope">
            <span data-scope="all" class="seg on">ALL</span>
            <span data-scope="favorites" class="seg">★ FAVS</span>
          </div>
          <span class="filt hidden" id="filter"></span>
        </div>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
