<!DOCTYPE html>
<html><head><meta charset="UTF-8" /></head>
<body><pre id="out"></pre><script type="module">
import { stateLabels, showsStar, normalizeKey, isValidKey, maskKey, accountStatus,
         activeTab, targetFor, signalBars, hintsFor,
         flagFor, countryHeading, countryName, matchesCountry,
         playedWhen, resultHeading, isSearchable, stationCount } from "./labels.js";
const out = [];
let failed = 0;
function eq(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  if (!ok) failed++;
  out.push(`${ok ? "ok  " : "FAIL"} ${name}${ok ? "" : ` — got ${JSON.stringify(got)} want ${JSON.stringify(want)}`}`);
}

eq("playing is live", stateLabels("playing").text, "LIVE");
eq("error retries", stateLabels("error").primary, "RETRY");
eq("unknown phase falls back to idle", stateLabels("nonsense").text, "IDLE");
eq("idle does not pulse", stateLabels("idle").pulse, false);


eq("star hidden when idle", showsStar("idle"), false);
eq("star shown when playing", showsStar("playing"), true);

// a pasted key carries whitespace, and a typed one may be capitalised.
eq("key trims whitespace", normalizeKey("  r4-abc123 \n"), "r4-abc123");
eq("key lowercases", normalizeKey("R4-ABC"), "r4-abc");
eq("empty key survives", normalizeKey(""), "");
eq("missing key survives", normalizeKey(undefined), "");

eq("valid key accepted", isValidKey("r4-abc123"), true);
eq("bare prefix rejected", isValidKey("r4-"), false);
eq("wrong prefix rejected", isValidKey("xx-abc"), false);
eq("punctuation rejected", isValidKey("r4-ab_c"), false);
// normalize must feed validate: uppercase alone is not a reason to refuse.
eq("caps validate after normalize", isValidKey(normalizeKey("R4-ABC")), true);

// masking is the only form the key may take after the save-this screen, so the
// middle of a four-segment id has to go and the ends have to stay recognisable.
eq("mask hides the middle segments", maskKey("r4-7K2P-9QXM-4DF1"), "r4-7K2P-····-4DF1");
eq("mask keeps a lowercase key readable", maskKey("r4-abcd-efgh-ijkl"), "r4-abcd-····-ijkl");
// a key that is not segmented still must not be shown; masking everything after
// the prefix is the safe direction to fail in.
// a real key is one 55-char run, so the ends are what tells two accounts apart.
eq("unsegmented key shows both ends", maskKey("r4-abc123def"), "r4-abc1····3def");
eq("real-shaped key shows both ends",
   maskKey("r4-tutgsmisaqwertyuiopasdfghjklzxcvbnmqwertyuiopasdfg"), "r4-tutg····sdfg");
// too short to split without giving away most of it — mask the lot instead.
eq("short key does not leak", maskKey("r4-ab"), "r4-····");
eq("exactly edge-length does not leak", maskKey("r4-abcdefgh"), "r4-····");
eq("unsegmented mask drops the middle",
   maskKey("r4-abcSECRETMIDdef").includes("SECRETMID"), false);
eq("bare prefix survives", maskKey("r4-"), "r4-····");
eq("empty key survives", maskKey(""), "");
eq("missing key survives", maskKey(undefined), "");
eq("null key survives", maskKey(null), "");
// the whole point: no masked form may ever contain a middle segment verbatim.
eq("mask drops middle segment", maskKey("r4-7K2P-9QXM-4DF1").includes("9QXM"), false);
eq("mask drops long middle", maskKey("r4-AAAA-SECRETMID-BBBB").includes("SECRETMID"), false);
eq("mask never returns the input", maskKey("r4-7K2P-9QXM-4DF1") === "r4-7K2P-9QXM-4DF1", false);
eq("five segments still mask the middle", maskKey("r4-AAAA-BBBB-CCCC-DDDD"), "r4-AAAA-····-DDDD");
eq("five segments drop every middle part",
   maskKey("r4-AAAA-BBBB-CCCC-DDDD").includes("BBBB") || maskKey("r4-AAAA-BBBB-CCCC-DDDD").includes("CCCC"),
   false);

// the section has three states and the copy differs in each; a signed-out state
// must never claim a count.
eq("signed out state", accountStatus({ signed_in: false, masked: "", favourites: 0 }).state, "signed_out");
eq("signed out has no pill", accountStatus({ signed_in: false, masked: "", favourites: 0 }).pill, "");
eq("signed in state", accountStatus({ signed_in: true, masked: "r4-7K2P-····-4DF1", favourites: 7 }).state, "signed_in");
eq("signed in pill reads synced", accountStatus({ signed_in: true, masked: "r4-a-····-b", favourites: 7 }).pill, "⊙ synced");
eq("favourites are counted", accountStatus({ signed_in: true, masked: "r4-a-····-b", favourites: 7 }).detail, "★ 7 favorites synced.");
eq("one favourite is singular", accountStatus({ signed_in: true, masked: "r4-a-····-b", favourites: 1 }).detail, "★ 1 favorite synced.");
eq("zero favourites reads plainly", accountStatus({ signed_in: true, masked: "r4-a-····-b", favourites: 0 }).detail, "★ no favorites yet.");
// a missing or malformed state must not crash the section into a blank pane.
eq("missing state falls back to signed out", accountStatus(undefined).state, "signed_out");
eq("empty state falls back to signed out", accountStatus({}).state, "signed_out");
// accountStatus carries what is rendered, so it must never carry a full key.
eq("status carries only the masked id",
   accountStatus({ signed_in: true, masked: "r4-7K2P-····-4DF1", favourites: 7 }).masked,
   "r4-7K2P-····-4DF1");

// the tabs drive which pane is visible, so this decides the whole window's
// state; every id must resolve and nothing else may.
eq("library is the landing tab", activeTab(undefined), "library");
eq("browse folds into the library", activeTab("browse"), "library");
eq("library is a tab", activeTab("library"), "library");
eq("settings is a tab", activeTab("settings"), "settings");
// an unknown id must land somewhere real rather than blanking the pane.
eq("unknown id falls back", activeTab("nonsense"), "library");
eq("empty id falls back", activeTab(""), "library");
eq("null id falls back", activeTab(null), "library");

// the tray still opens the window by the old sidebar section names. each one is
// a sub-view now, so it has to open the tab holding it — and select that
// sub-view, or "Open r4dio" lands on the wrong half of Library.
eq("favourites opens its segment", targetFor("favourites"), { tab: "library", sub: "favourites" });
eq("blocked opens its settings section", targetFor("blocked"), { tab: "settings", sub: "blocked" });
eq("sync opens the account", targetFor("sync"), { tab: "settings", sub: "account" });
eq("countries opens settings", targetFor("countries"), { tab: "settings", sub: "countries" });
eq("browse is the all segment", targetFor("browse"), { tab: "library", sub: "all" });
eq("an unknown id still lands", targetFor("nonsense"), { tab: "library", sub: null });

// the signal column is bitrate, not a measurement — the scale must be monotonic
// and a station with no bitrate must not claim one bar.
eq("no bitrate shows nothing", signalBars(0), 0);
eq("missing bitrate shows nothing", signalBars(undefined), 0);
eq("320k is full", signalBars(320), 5);
eq("256k is full", signalBars(256), 5);
eq("192k is four", signalBars(192), 4);
eq("128k is three", signalBars(128), 3);
eq("64k is two", signalBars(64), 2);
eq("32k is one", signalBars(32), 1);

// a hint for a key the tab does not answer teaches the user to stop reading.
eq("the library offers search", hintsFor("library").some(([k]) => k === "⌘F"), true);
eq("settings does not", hintsFor("settings").some(([k]) => k === "⌘F"), false);
eq("an unknown tab still has hints", hintsFor("nonsense").length > 0, true);
// the footer promises SPACE on every tab, so every tab must answer it.
eq("space is promised in the library", hintsFor("library").some(([k]) => k === "SPACE"), true);
eq("space is promised in settings", hintsFor("settings").some(([k]) => k === "SPACE"), true);

// history stamps are unix SECONDS (radio-core now_secs), not millis — reading
// them as millis would date every row to 1970 and print "2857w ago".
const T = 1_760_000_000;
eq("a fresh play reads as now", playedWhen(T - 5, T), "just now");
eq("minutes read as minutes", playedWhen(T - 18 * 60, T), "18 min ago");
eq("hours read as hours", playedWhen(T - 5 * 3600, T), "5h ago");
eq("a day back is yesterday", playedWhen(T - 26 * 3600, T), "yesterday");
eq("days read as days", playedWhen(T - 3 * 86400, T), "3d ago");
eq("a week reads as a week", playedWhen(T - 8 * 86400, T), "last week");
eq("weeks read as weeks", playedWhen(T - 21 * 86400, T), "3w ago");
// a missing or future stamp must print nothing rather than a negative age.
eq("a missing stamp prints nothing", playedWhen(0, T), "");
eq("a future stamp prints nothing", playedWhen(T + 500, T), "");

// rows lead with a flag; radio-browser country codes are two-letter and cased
// inconsistently, and plenty of stations carry none at all.
eq("lowercase code still flags", flagFor("ua"), "🇺🇦");
eq("uppercase code flags", flagFor("MX"), "🇲🇽");
// a missing code must not render a broken glyph where the flag belongs.
eq("missing code has no flag", flagFor(""), "");
eq("undefined code has no flag", flagFor(undefined), "");
// three letters is not a country code; guessing would draw nonsense.
eq("three letters is not a flag", flagFor("USA"), "");
eq("one letter is not a flag", flagFor("U"), "");
eq("digits are not a flag", flagFor("12"), "");

// the row's second line is either the live marker or the format, never both.
// radio-browser reports 0 bitrate for plenty of stations; "AAC 0k" is noise.

// the sidebar footer counts two different filters and must stay honest at zero.

// the pane header carries the count; an empty list must not read as a failure.

// a blocked uuid the catalogue dropped still needs a row to be unblocked from.


// "3 of 194": how many of the countries on offer are switched off.
eq("on air out of total", countryHeading(191, 194), "191 of 194");
eq("everything off is still honest", countryHeading(0, 194), "0 of 194");
eq("missing counts read as zero", countryHeading(undefined, undefined), "0 of 0");

// names come from the browser's own table rather than a shipped list of 194.
eq("a code becomes a name", countryName("CH"), "Switzerland");
eq("a lowercase code still resolves", countryName("ua"), "Ukraine");
// an unmappable code shows as itself: a wrong country name is worse than a code.
eq("an unknown code shows itself", countryName("ZZ"), "ZZ");
eq("a non-code is left alone", countryName("USA"), "USA");
eq("a missing code does not throw", countryName(undefined), "");

// the filter box matches what the user reads and what they might type.
eq("empty term matches everything", matchesCountry({ code: "CH" }, ""), true);
eq("a missing term matches everything", matchesCountry({ code: "CH" }, undefined), true);
eq("the name matches", matchesCountry({ code: "CH" }, "switz"), true);
eq("the code matches", matchesCountry({ code: "CH" }, "ch"), true);
eq("case does not matter", matchesCountry({ code: "UA" }, "UKRAI"), true);
eq("a miss is a miss", matchesCountry({ code: "CH" }, "japan"), false);

// the result list is capped, and a capped list has to admit it — a user who
// searches "radio" must not believe they are looking at every match.
eq("a short result list just counts", resultHeading(12, false), "12 results");
eq("one result reads as one", resultHeading(1, false), "1 result");
eq("a capped list says it is capped", resultHeading(200, true), "first 200 results");
eq("no results reads as a state", resultHeading(0, false), "nothing found");

// the search is offline over 58k rows; one or two letters match most of the
// catalogue and cost a full scan for a list nobody wants.
eq("a single letter is not searched yet", isSearchable("j"), false);
eq("two letters search", isSearchable("uk"), true);
eq("whitespace is not a term", isSearchable("   "), false);
eq("a missing term is not a term", isSearchable(undefined), false);
eq("padding does not count towards length", isSearchable(" j "), false);

// counts run to four figures, so they are grouped rather than run together.
eq("a large count is grouped", stationCount(7666), "7,666");
eq("a small count is plain", stationCount(312), "312");

document.getElementById("out").textContent =
  out.join("\n") + `\n\n${failed === 0 ? "ALL PASS" : failed + " FAILED"}`;
</script></body></html>
