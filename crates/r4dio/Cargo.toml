[package]
name = "r4dio"
version.workspace = true
edition = "2021"
license = "MIT"
description = "World Radio: a terminal radio player for 30,000+ stations."
repository = "https://github.com/Chubik/world-radio"
homepage = "https://r4dio.net"
readme = "../../README.md"
keywords = ["radio", "streaming", "tui", "audio", "player"]
categories = ["command-line-utilities", "multimedia::audio"]

# no [[bin]] section: the package is named r4dio, so cargo builds src/main.rs
# into a binary of the same name on its own.

[dependencies]
radio-core = { path = "../radio-core", version = "1" }
radio-audio = { path = "../radio-audio", version = "1" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ratatui = "0.30"
crossterm = "0.29"
rustfft = "6.4"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
qrcode = "0.14"
base64 = "0.22"

[dev-dependencies]
mockito = "1"
tempfile = "3"
