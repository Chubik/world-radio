[workspace]
resolver = "2"
members = ["crates/radio-core", "crates/radio-audio", "crates/r4dio", "crates/r4dio-macos"]

[workspace.package]
# NOT the released version — releases are numbered from the newest git tag, and
# CI stamps that number here before it builds. main never carries the result
# (branch protection forbids CI pushing to it), so this line stays at whatever
# it was when tag-derived versioning came in. `git describe --tags --abbrev=0`
# is the real answer; a built binary reports it correctly via --version.
version = "1.4.5"
