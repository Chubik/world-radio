name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# every `uses:` below is pinned to a full commit sha. a tag like `@v4` is a
# movable pointer: whoever owns the action can repoint it at new code, and it
# would run here with our signing keys. the trailing comment names the version
# the sha belongs to — bump both together, deliberately.
#
# this repository is PUBLIC: anyone can open a pull request from a fork and run
# the `rust` job below. the default token is therefore read-only, and each job
# that needs more asks for it explicitly. a blanket `contents: write` here would
# hand write access to every job, including the one fork code runs in.
permissions:
  contents: read

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    # the only job a fork's pull request can reach. it gets no secrets and no
    # write scope, so untrusted code runs with nothing worth stealing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, v1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: system libs (cpal needs alsa, tauri needs gtk/glib/webkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  version:
    name: compute + tag version
    runs-on: ubuntu-latest
    # skip when the head commit is our own stamp commit, else the push it makes
    # would re-trigger this job forever.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'release: v')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      notes: ${{ steps.bump.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: compute next version
        id: bump
        run: |
          git fetch --tags
          last="$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          [ -n "$last" ] || last="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          level=patch
          msg="$(git log -1 --pretty=%B)"
          case "$msg" in
            *'[major]'*) level=major ;;
            *'[minor]'*) level=minor ;;
          esac
          next="$(./scripts/bump-version.sh next "$last" "$level")"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "last=$last level=$level next=$next"

          # changelog, built from the commit subjects themselves. this project
          # writes subjects as user-facing changelog lines on purpose, so the
          # material is already there — the old filter looked for conventional
          # `feat:`/`fix:` prefixes, matched nothing, and every release shipped
          # the fallback instead.
          #   - keep every subject, then drop the ones users must never read:
          #     plan/spec/brief docs, release bumps, and ci/format chores
          #   - strip a leading `cli:`/`android:` scope, which names the surface
          #     rather than the change
          #   - capitalise the first letter and de-duplicate
          range="v${last}..HEAD"
          git rev-parse -q --verify "v${last}" >/dev/null 2>&1 || range="HEAD"
          notes="$(git log "$range" --no-merges --pretty=%s \
            | grep -vEi '^(plan|spec|brief|docs?|chore|ci|style|test|build|refactor)[:( ]' \
            | grep -vEi '^(release|bump|stamp|format|merge)[:( ]' \
            | grep -vEi '^(add|update) the (plan|spec)' \
            | sed -E 's/^(cli|android|macos|site|sync|server): *//' \
            | awk 'NF { $0 = toupper(substr($0,1,1)) substr($0,2); if (!seen[$0]++) print "- " $0 }' \
            || true)"
          [ -n "$notes" ] || notes="- Maintenance and internal improvements."
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: stamp files + tag
        run: |
          ver="${{ steps.bump.outputs.version }}"
          ./scripts/bump-version.sh stamp "$ver"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          # the tauri config carries its own version and is stamped above; leaving
          # it out of the commit ships a bundle whose about-box names an old release.
          git add Cargo.toml android/app/build.gradle.kts crates/r4dio-macos/tauri.conf.json
          # refresh lockfile so the crate version in Cargo.lock matches
          cargo update -p r4dio --precise "$ver" 2>/dev/null || cargo generate-lockfile
          git add Cargo.lock || true
          # the tag carries the stamped version; main files are left untouched
          # (branch protection forbids CI pushing to main). the tag is the
          # source of truth for the release; release jobs check out this tag.
          git commit -m "release: v${ver}"
          git tag "v${ver}"
          git push origin "v${ver}"

  android-release:
    name: android apk beta release
    runs-on: ubuntu-latest
    needs: version
    # publishes a release and prunes old ones; unreachable from a fork pr
    # because of the branch condition below.
    permissions:
      contents: write
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'release: v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: latest

      - name: install sdk packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # the release key must come from the secrets. a debug key is regenerated
      # per machine, so every build would carry a different signature and
      # android would refuse to update over the last one — the user loses every
      # setting they had, including the sync key that is their whole account.
      - name: restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set — refusing to ship an unsignable apk" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/r4dio-release.jks"

      - name: build signed apk
        env:
          R4DIO_KEYSTORE: ${{ runner.temp }}/r4dio-release.jks
          R4DIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          R4DIO_KEY_ALIAS: r4dio
        run: cd android && ./gradlew assembleRelease

      - name: package apk and checksum
        id: pkg
        run: |
          version="${{ needs.version.outputs.version }}"
          apk="r4dio-${version}-beta.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS-android
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: release notes
        env:
          CHANGELOG: ${{ needs.version.outputs.notes }}
        run: |
          {
            printf '# r4dio v%s\n\n' "${{ needs.version.outputs.version }}"
            printf 'One release, all platforms — CLI (Linux + macOS) and the Android APK.\n\n'
            printf "## What's new\n\n"
            printf '%s\n\n' "$CHANGELOG"
            printf '## Install\n\n'
            printf 'CLI: `curl -fsSL https://r4dio.net/install | sh`\n\n'
            printf 'Android: download `%s` (debug-signed beta, Android 8+).\n\n' "${{ steps.pkg.outputs.apk }}"
            printf 'Verify: `sha256sum -c SHA256SUMS` (CLI) / `sha256sum -c SHA256SUMS-android` (APK).\n'
          } > release-notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: r4dio v${{ needs.version.outputs.version }}
          # a prerelease never resolves from releases/latest, which is where the
          # macos updater reads its manifest — releases must be real releases.
          body_path: release-notes.md
          files: |
            ${{ steps.pkg.outputs.apk }}
            SHA256SUMS-android

      - name: keep only the latest 5 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                echo "deleting old release $tag"
                gh release delete "$tag" --cleanup-tag --yes || true
              done

  cli-release:
    name: cli tarball
    needs: version
    # builds and uploads a workflow artifact only — no repo writes needed.
    permissions:
      contents: read
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'release: v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - name: rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: system libs (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libglib2.0-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev

      - name: build
        run: cargo build --release -p r4dio --target ${{ matrix.target }}

      - name: package
        id: pkg
        run: |
          version="${{ needs.version.outputs.version }}"
          asset="r4dio-${version}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$asset" r4dio
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha"
          else
            shasum -a 256 "$asset" > "$asset.sha"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.target }}
          retention-days: 1
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha

  macos-app:
    name: macos app bundle
    needs: version
    permissions:
      contents: read
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'release: v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, v1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: install tauri cli
        run: cargo install tauri-cli --version '^2' --locked

      # the runner is apple silicon, so an untargeted build ships arm64 only and
      # will not launch on an intel mac — there is one macos asset for both.
      - name: build the bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd crates/r4dio-macos && cargo tauri build --target universal-apple-darwin

      - name: package
        id: pkg
        run: |
          version="${{ needs.version.outputs.version }}"
          app="target/universal-apple-darwin/release/bundle/macos/r4dio.app"
          test -d "$app" || { echo "no bundle at $app"; ls -R target/universal-apple-darwin/release/bundle || true; exit 1; }
          archs="$(lipo -archs "$app/Contents/MacOS/r4dio-macos")"
          echo "bundle archs: $archs"
          for want in x86_64 arm64; do
            case " $archs " in *" $want "*) ;; *) echo "bundle is missing $want"; exit 1;; esac
          done
          asset="r4dio-${version}-macos.zip"
          ditto -c -k --keepParent "$app" "$asset"
          shasum -a 256 "$asset" > "$asset.sha"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          # tauri names the dmg r4dio_<conf-version>_universal.dmg, which is not the
          # scheme the site builds its download links from — rename to match.
          built_dmg="$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)"
          test -n "$built_dmg" || { echo "no dmg was built"; ls -R target/universal-apple-darwin/release/bundle || true; exit 1; }
          dmg="r4dio-${version}-macos.dmg"
          mv "$built_dmg" "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          # updater artifacts: tauri emits a signed app.tar.gz when
          # createUpdaterArtifacts is on; a release without them would strand
          # every installed copy on its current version, so fail loudly.
          built_upd="$(find target/universal-apple-darwin/release/bundle -name '*.app.tar.gz' | head -1)"
          test -n "$built_upd" || { echo "no updater archive was built"; exit 1; }
          test -f "$built_upd.sig" || { echo "updater archive is unsigned"; exit 1; }
          upd="r4dio-${version}-macos-update.tar.gz"
          mv "$built_upd" "$upd"
          mv "$built_upd.sig" "$upd.sig"
          url="https://github.com/Chubik/world-radio/releases/download/v${version}/${upd}"
          jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg sig "$(cat "$upd.sig")" --arg url "$url" \
                '{version:$v, pub_date:$d, platforms:{"darwin-aarch64":{signature:$sig,url:$url},"darwin-x86_64":{signature:$sig,url:$url}}}' \
                > latest.json
          jq -e '.version != "" and (.platforms["darwin-aarch64"].signature|length>0) and (.platforms["darwin-x86_64"].signature|length>0)' latest.json >/dev/null
          echo "upd=$upd" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app
          retention-days: 1
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha
            ${{ steps.pkg.outputs.dmg }}
            ${{ steps.pkg.outputs.dmg }}.sha
            ${{ steps.pkg.outputs.upd }}
            ${{ steps.pkg.outputs.upd }}.sig
            latest.json

  cli-release-publish:
    name: publish cli tarballs
    needs: [version, android-release, cli-release, macos-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # writes the release assets, then prunes old workflow runs and caches.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-app
          path: dist

      - name: combine checksums
        id: sums
        run: |
          version="${{ needs.version.outputs.version }}"
          cd dist
          cat ./*.sha | sed 's# \./# #' > SHA256SUMS
          rm -f ./*.sha
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # unsigned checksums prove a download was not corrupted, not that it is
      # ours. sign them with the release key, whose public half is published on
      # r4dio.net — a different host from the releases themselves.
      - name: sign the checksums
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_RELEASE_KEY }}
          PUBKEY: RWQPpyPbplhYrqJWPJvO7cw6ZAq9mY0dtC0nBClXataAqT/9L+bN8iOO
        run: |
          test -n "$MINISIGN_KEY" || { echo "MINISIGN_RELEASE_KEY is not set"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          printf '%s\n' "$MINISIGN_KEY" > key
          cd dist
          minisign -S -s ../key -m SHA256SUMS -t "r4dio ${{ needs.version.outputs.version }} checksums"
          rm -f ../key
          # a signature nobody can verify is theatre — prove it verifies here.
          minisign -Vm SHA256SUMS -P "$PUBKEY"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.sums.outputs.version }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*-update.tar.gz
            dist/*-update.tar.gz.sig
            dist/latest.json
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig

      # NO ops dispatch here, and no token for one. this repository is public,
      # and a credential that triggers a deploy is the one thing a public repo
      # must never hold: signing keys can only sign, but a dispatch token
      # reaches our infrastructure. ops picks up a new release on its own
      # 30-minute cron, so the only cost of removing it is that delay.
      # if the wait ever becomes a problem, poll from ops — never push from here.

      - name: reclaim actions storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # keep only the 10 most recent workflow runs — logs are the bulk of the
          # 0.5gb actions storage and pile up every release.
          gh api "/repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[10:] | .[].id' \
            | while read -r rid; do
                [ -n "$rid" ] || continue
                gh api -X DELETE "/repos/${{ github.repository }}/actions/runs/$rid" >/dev/null 2>&1 \
                  && echo "deleted run $rid" || true
              done
          # drop all actions caches (rebuilt on demand next run)
          gh api "/repos/${{ github.repository }}/actions/caches?per_page=100" \
            --jq '.actions_caches[].id' \
            | while read -r cid; do
                [ -n "$cid" ] || continue
                gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/$cid" >/dev/null 2>&1 \
                  && echo "deleted cache $cid" || true
              done
